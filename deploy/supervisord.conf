[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

# All three programs log to the container's stdout so `docker logs` shows
# everything. autorestart keeps a crashed process from taking the demo down
# silently.

[program:allinone]
# AllInOne is a web host (exposes /health/live and /health/ready). It listens
# on 8081 so it doesn't collide with the gateway on 8080; the port is internal
# only (the container health check hits it on loopback, nothing publishes it).
command=dotnet /app/allinone/OmNomNom.AllInOne.dll
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=ASPNETCORE_URLS="http://+:8081",ASPNETCORE_ENVIRONMENT="Production",OMNOMNOM_DB_DIR="/data/db",OMNOMNOM_TRANSPORT_DIR="/data/transport"

[program:gateway]
command=dotnet /app/gateway/CompositionGateway.dll
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=ASPNETCORE_URLS="http://+:8080",ASPNETCORE_ENVIRONMENT="Production",OMNOMNOM_DB_DIR="/data/db",OMNOMNOM_TRANSPORT_DIR="/data/transport"

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
