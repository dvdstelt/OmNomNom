server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SvelteKit static build (adapter-static): serve files, fall back to
    # index.html so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Single-container variant: the gateway runs in this same container, so
    # forward /api (prefix stripped) to it on loopback. Browser stays
    # same-origin, so no CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
